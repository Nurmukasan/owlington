<!doctype html><html><head><meta charset="utf-8"><style>

html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#160f24}

</style></head><body>
<img class="bg" src="../st/eyes.png"><div class="sh"></div>

const BODY=['odbbbllllllbbbdo','oddblmlmmlmlbddo','oddbllmllmllbddo','oddbllllllllbddo','.oddbllllllbddo.','..oddbbbbbbddo..','...ooffooffoo...']
const P={o:'#1e120c',b:'#7f5236',d:'#523220',l:'#ecd0a2',m:'#b98b5c',w:'#f3e3c3',y:'#ffb627',k:'#120c08',h:'#ffffff',n:'#f08a24',f:'#e09a34'}
