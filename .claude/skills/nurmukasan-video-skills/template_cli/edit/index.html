<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:PS;src:url(fonts/ps-lat.woff2)}
@font-face{font-family:PS;src:url(fonts/ps-latx.woff2);unicode-range:U+0100-024F,U+2190-21FF,U+2022,U+2013-2014}
@font-face{font-family:PS;src:url(fonts/ps-cyr.woff2);unicode-range:U+0400-04FF}
@font-face{font-family:Fr;src:url(fonts/fr.woff2);font-weight:100 900}
:root{--ink:#160f24;--panel:#231b40;--panel2:#2f2556;--lilac:#c39bff;--lilacD:#8a62d6;--pink:#ff8fc7;--cream:#fff1c9;--yellow:#ffd23f;--gold:#f2a541;--mint:#7fe0a8;--red:#ff5a6e;--white:#f7f3ff;--grey:#a89cc8;--sky:#a8d8ff}
html,body{margin:0;width:720px;height:1280px;overflow:hidden;background:#000}
#stage{position:absolute;inset:0;overflow:hidden}
.bg{position:absolute;left:0;top:0;transform-origin:0 0;image-rendering:auto}
#fx{position:absolute;inset:0;pointer-events:none}
#ov{position:absolute;inset:0}
.p{position:absolute;font-family:PS;color:var(--cream);line-height:1.35}
.panel{position:absolute;box-sizing:border-box;border:5px solid var(--lilac);border-radius:14px;background:linear-gradient(var(--panel2),var(--panel));box-shadow:6px 9px 0 rgba(22,15,36,.6)}
.panel::after{content:'';position:absolute;left:12px;right:12px;top:6px;height:3px;border-radius:2px;background:rgba(255,255,255,.16)}
.chip{position:absolute;font-family:PS;color:var(--ink);border:4px solid var(--ink);border-radius:10px;padding:12px 15px 10px;box-shadow:4px 6px 0 rgba(22,15,36,.6);white-space:nowrap}
.tab{position:absolute;font-family:PS;font-size:13px;color:var(--ink);border:3px solid var(--ink);border-radius:8px;padding:8px 12px 6px;white-space:nowrap}
.stroke{text-shadow:3px 0 var(--ink),-3px 0 var(--ink),0 3px var(--ink),0 -3px var(--ink),3px 3px var(--ink),-3px 3px var(--ink),3px -3px var(--ink),-3px -3px var(--ink),6px 7px var(--ink)}
.stroke2{text-shadow:4px 0 var(--ink),-4px 0 var(--ink),0 4px var(--ink),0 -4px var(--ink),4px 4px var(--ink),-4px 4px var(--ink),4px -4px var(--ink),-4px -4px var(--ink),8px 8px #c8304a,9px 10px var(--ink)}
.cap{position:absolute;left:90px;width:540px;top:872px;display:flex;flex-wrap:wrap;justify-content:center;gap:14px 16px;font-family:PS;font-size:27px;line-height:1.3}
.cap span{text-shadow:3px 0 var(--ink),-3px 0 var(--ink),0 3px var(--ink),0 -3px var(--ink),3px 3px var(--ink),-3px 3px var(--ink),3px -3px var(--ink),-3px -3px var(--ink),3px 5px var(--ink)}
.bar{position:absolute;height:22px;border:3px solid var(--ink);border-radius:5px;background:#3a2f66;box-sizing:border-box;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0}
</style></head><body>
<div id="stage"><img id="bgA" class="bg"><img id="bgB" class="bg"><div id="fx"></div><div id="ov"></div></div>
<script src="timeline.js"></script>
<script src="engine.js"></script>
<script src="spec.js"></script>
</body></html>
