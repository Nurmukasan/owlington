<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:PS;src:url(../edit/fonts/ps-lat.woff2)}
@font-face{font-family:PS;src:url(../edit/fonts/ps-cyr.woff2);unicode-range:U+0400-04FF}
body{margin:0;font-family:PS}
.s{position:relative;overflow:hidden}
.t{position:absolute;white-space:nowrap}
.bar{position:absolute;background:#d9d2ea;border:3px solid #160f24}
.bar i{position:absolute;left:0;top:0;bottom:0}
</style></head><body><div id="root"></div>
<script>
const T=(x,y,size,col,txt,extra='')=>`<div class="t" style="left:${x}px;top:${y}px;font-size:${size}px;color:${col};${extra}">${txt}</div>`
const SK=[['L','LISTENING','#3a8fd6'],['R','READING','#d89a00'],['W','WRITING','#d0457a'],['S','SPEAKING','#2f9e64']]
function paper(W,H,title,vals,hot){let h=`<div class="s" style="width:${W}px;height:${H}px;background:#fbf8f0">`+
  T(W*.1,H*.06,Math.min(H*.045,W*.8/title.length),'#160f24',title)+`<div style="position:absolute;left:${W*.07}px;right:${W*.07}px;top:${H*.13}px;height:3px;background:#160f24"></div>`
  SK.forEach(([k,n,c],i)=>{const y=H*(.17+i*.13);h+=T(W*.07,y,H*.035,c,n)+`<div class="bar" style="left:${W*.07}px;top:${y+H*.05}px;width:${W*.58}px;height:${H*.045}px;${i===hot?'border-color:#d0243a':''}"><i style="width:${vals[i]/9*100}%;background:${i===hot?'#d0243a':c}"></i></div>`+T(W*.69,y+H*.035,Math.min(H*.05,W*.06),i===hot?'#d0243a':'#160f24',vals[i].toFixed(1))})
  const o=Math.round(vals.reduce((a,b)=>a+b)/4*2)/2;return h+T(W*.18,H*.725,Math.min(H*.035,W*.04),'#6d6290','OVERALL')+T(W*.62,H*.7,Math.min(H*.075,W*.09),'#d0243a',o.toFixed(1))+`</div>`}
window.mock0=(W,H)=>paper(W,H,'MOCK TEST · ДЕНЬ 0',[5,5,5,5],-1)
window.mock45=(W,H)=>paper(W,H,'MOCK TEST · ДЕНЬ 45',[6.5,7,5,6.5],2)
window.settings=(W,H,n)=>{const rows=[['LANGUAGE','РУССКИЙ','ENGLISH'],['SUBTITLES','OFF','ON'],['SERVER','RU','INTERNATIONAL']]
  let h=`<div class="s" style="width:${W}px;height:${H}px;background:linear-gradient(#22184a,#0f0b24)">`+T(W*.06,H*.08,H*.09,'#ffd23f','SETTINGS')+`<div style="position:absolute;left:${W*.06}px;right:${W*.06}px;top:${H*.24}px;height:3px;background:#c39bff"></div>`
  rows.forEach(([k,a,b],i)=>{const y=H*(.33+i*.2),on=i<n;const tx=(on?'▶ ':'')+(on?b:a);h+=T(W*.06,y,Math.min(H*.065,W*.035),'#a89cc8',k)+T(W*.4,y-H*.01,Math.min(H*.075,W*.52/tx.length),on?'#7fe0a8':'#f7f3ff',tx,on?'text-shadow:0 0 8px #7fe0a8':'')});return h+`</div>`}
window.sub=(W,H)=>`<div class="s" style="width:${W}px;height:${H}px;background:#120c20;display:flex;align-items:center;justify-content:center;text-align:center">`+`<div style="font-size:${H*.2}px;color:#fff;line-height:1.5">Where is the key<br>to the old tower?</div></div>`
window.result=(W,H,n)=>{const R=[['READING','#ffd23f',7.5],['LISTENING','#a8d8ff',7],['SPEAKING','#7fe0a8',7],['WRITING','#ff8fc7',5]]
  let h=`<div class="s" style="width:${W}px;height:${H}px;background:linear-gradient(#2f2556,#160f24)">`+T(W*.05,H*.08,H*.075,'#ffd23f','IELTS · РЕЗУЛЬТАТ')
  R.forEach(([k,c,v],i)=>{const y=H*(.27+i*.16),on=i<n;h+=T(W*.05,y,H*.065,c,k)+T(W*.42,y-H*.01,H*.08,on?(i===3?'#ff5a6e':'#fff1c9'):'#6d6290',on?v.toFixed(1):'?')})
  h+=`<div style="position:absolute;left:${W*.6}px;top:${H*.25}px;width:${W*.35}px;height:${H*.62}px;border:4px solid #ffd23f;border-radius:10px;box-sizing:border-box"></div>`+T(W*.6,H*.33,H*.065,'#fff1c9','OVERALL','width:'+(W*.35)+'px;text-align:center')+T(W*.6,H*.48,H*.2,n>=5?'#ffd23f':'#6d6290',n>=5?'6.5':'?.?','width:'+(W*.35)+'px;text-align:center')
  return h+`</div>`}
</script></body></html>
